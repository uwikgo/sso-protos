syntax = "proto3";

package Auth;

option go_package = "github.com/uwikgo/sso-protos/gen;ssov1";

service Auth {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login (LoginRequest) returns (LoginResponse);
    rpc IsAdmin (IsAdminRequest) returns (IsAdminResponse);
}

message RegisterRequest{
    string email = 1;      // Создаем ручку, вводя информацию емэйла и пароля и получаем поосле юзер айди
    string password = 2;
}

message RegisterResponse{
    int64 user_id = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;
    string app_id = 3;      // ID приложения 
}

message LoginResponse {
    string token = 1;    // жвт токен (обывяная строка тхт)
}

message IsAdminRequest {
    int64 user_id = 1;
}

message IsAdminResponse {
    bool is_admin = 1;
}